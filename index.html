<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AR Малювання" />
  <title>AR Малювання — iPhone 11</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      /* Безпечний відступ зверху, щоб системна кнопка 'X' у лівому куті не перекривала панель */
      --header-offset: max(64px, calc(var(--safe-top) + 48px));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    /* Потік з основної камери на весь екран без можливості системного перехоплення */
    #cameraFeed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #000;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Сцена для маніпуляцій із зображенням */
    #arStage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    /* Накладене фото для перемальовування */
    #overlayImage {
      max-width: 85vw;
      max-height: 75vh;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      pointer-events: none;
      transition: filter 0.2s ease;
    }

    /* Анімація прицілу фокусування на аркуші */
    @keyframes focusPulse {
      0% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
      25% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      75% {
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0;
      }
    }

    .focus-reticle {
      position: fixed;
      width: 76px;
      height: 76px;
      border: 2px solid #facc15;
      border-radius: 16px;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.45), inset 0 0 8px rgba(250, 204, 21, 0.25);
      pointer-events: none;
      z-index: 25;
      animation: focusPulse 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .focus-reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #facc15;
      border-radius: 9999px;
      transform: translate(-50%, -50%);
    }

    /* Кастомні повзунки для зручного керування пальцем на iPhone */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      border: 2px solid #38bdf8;
    }

    /* Плавне приховування інтерфейсу в режимі «На весь екран» (без системного Fullscreen API) */
    .ui-layer {
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    #appContainer.hud-hidden .ui-layer {
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
    }

    #appContainer.hud-hidden #topBar {
      transform: translateY(-16px);
    }

    /* Кнопка виходу з чистого режиму */
    #exitFullscreenBtn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.2s ease;
    }

    #appContainer.hud-hidden #exitFullscreenBtn {
      opacity: 1;
      pointer-events: auto;
    }

    /* Glassmorphism стиль панелей */
    .glass-panel {
      background: rgba(18, 18, 22, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Згортання тіла нижньої панелі */
    #controlsBody {
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.2s ease;
      max-height: 360px;
      overflow: hidden;
    }

    #bottomControls.collapsed #controlsBody {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="text-white antialiased">
<div id="appContainer" class="relative h-full w-full overflow-hidden">

  <!-- Відеопотік із задньої камери iPhone 11 із забороною системного плеєра iOS -->
  <video
    id="cameraFeed"
    autoplay
    playsinline
    webkit-playsinline
    muted
    disablepictureinpicture
    controlslist="nodownload nofullscreen noremoteplayback"
    x-webkit-airplay="deny"
  ></video>

  <!-- Інтерактивна сцена для переміщення, обертання та зуму зображення -->
  <div id="arStage">
    <!-- Еталонне зображення -->
    <img
      id="overlayImage"
      alt="Зображення для перемальовування"
      class="hidden"
    />

    <!-- Стартова картка вибору фото по центру екрана -->
    <div id="emptyStateHint" class="ui-layer z-20 mx-5 w-full max-w-xs rounded-3xl glass-panel p-5 text-center shadow-2xl">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-sky-500/20 text-sky-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <h2 class="text-base font-semibold text-white">Оберіть фото для малювання</h2>
      <p id="cameraStatusText" class="mt-1.5 text-xs leading-relaxed text-zinc-300">
        Завантажте картинку з галереї iPhone, наведіть камеру на аркуш паперу та перемальовуйте.
      </p>

      <div class="mt-4 flex flex-col gap-2">
        <label
          for="imageInput"
          class="inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-2xl bg-sky-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/25 active:scale-95 transition"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Обрати фото з галереї
        </label>

        <!-- Кнопка ручного запуску камери, якщо браузер заблокував автозапуск -->
        <button
          id="enableCameraBtn"
          type="button"
          class="hidden w-full items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/10 px-4 py-2.5 text-xs font-semibold text-white active:scale-95 transition"
        >
          <svg class="h-4 w-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          Увімкнути камеру
        </button>
      </div>
    </div>
  </div>

  <!-- Верхня панель керування розташована нижче системної кнопки 'X' у лівому верхньому куті -->
  <header
    id="topBar"
    class="ui-layer fixed left-0 right-0 top-0 z-30 flex items-center justify-between gap-1.5 px-3 pb-2"
    style="padding-top: var(--header-offset);"
  >
    <div class="flex items-center gap-1.5 min-w-0">
      <!-- Кнопка вибору / заміни фото -->
      <label
        for="imageInput"
        class="glass-panel flex shrink-0 cursor-pointer items-center gap-1.5 whitespace-nowrap rounded-2xl px-3 py-2 text-xs font-semibold text-white shadow-lg active:scale-95 transition"
      >
        <svg class="h-4 w-4 shrink-0 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Фото</span>
      </label>
      <input id="imageInput" type="file" accept="image/*" class="hidden" />

      <!-- Кнопка фокусування камери на аркуші -->
      <button
        id="focusPaperBtn"
        type="button"
        title="Сфокусувати камеру на аркуші"
        class="glass-panel flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-2xl px-3 py-2 text-xs font-medium text-amber-300 shadow-lg active:scale-95 transition"
      >
        <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2m8-16h2a2 2 0 012 2v2m0 8v2a2 2 0 01-2 2h-2M12 9v6m-3-3h6" />
        </svg>
        <span>Фокус</span>
      </button>

      <!-- Кнопка ручного перезапуску потоку камери, якщо iOS WebView заморозив кадр -->
      <button
        id="refreshCameraBtn"
        type="button"
        title="Оновити відеопотік камери"
        aria-label="Оновити камеру"
        class="glass-panel flex shrink-0 items-center justify-center rounded-2xl p-2 text-emerald-300 shadow-lg active:scale-95 transition"
      >
        <svg id="refreshCameraIcon" class="h-4 w-4 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- Кнопка ліхтарика (підсвітка аркуша) -->
      <button
        id="torchBtn"
        type="button"
        title="Підсвітка аркуша"
        class="glass-panel hidden shrink-0 items-center justify-center rounded-2xl p-2 text-zinc-200 shadow-lg active:scale-95 transition"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </button>
    </div>

    <!-- Кнопка «На весь екран» в один рядок -->
    <button
      id="fullscreenBtn"
      type="button"
      class="flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-2xl bg-white px-3 py-2 text-xs font-bold text-zinc-950 shadow-lg active:scale-95 transition"
    >
      <svg class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
      <span>На весь екран</span>
    </button>
  </header>

  <!-- Акуратне спливаюче повідомлення статусу -->
  <div
    id="toastMessage"
    class="pointer-events-none fixed left-1/2 z-40 -translate-x-1/2 whitespace-nowrap rounded-full bg-zinc-900/90 px-4 py-1.5 text-xs font-medium text-white opacity-0 shadow-lg backdrop-blur-md border border-white/15 transition-opacity duration-300"
    style="top: calc(var(--header-offset) + 46px);"
  ></div>

  <!-- Міні-кнопка повернення інтерфейсу (видима лише в режимі «На весь екран») -->
  <button
    id="exitFullscreenBtn"
    type="button"
    aria-label="Повернути меню"
    class="fixed right-3 z-40 flex items-center gap-1.5 whitespace-nowrap rounded-full bg-zinc-900/75 px-3.5 py-2 text-xs font-medium text-white/95 backdrop-blur-md border border-white/15 shadow-lg active:scale-95"
    style="top: var(--header-offset);"
  >
    <svg class="h-4 w-4 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    <span>Меню</span>
  </button>

  <!-- Нижня панель інструментів малювання (з'являється після вибору фото) -->
  <section
    id="bottomControls"
    class="ui-layer hidden fixed bottom-0 left-0 right-0 z-30 px-3 pt-1.5"
    style="padding-bottom: calc(16px + var(--safe-bottom));"
  >
    <div class="mx-auto max-w-md rounded-3xl glass-panel px-3.5 py-3 shadow-2xl">
      
      <!-- Верхній компактний рядок панелі: швидкі кнопки + згортання панелі -->
      <div class="flex items-center gap-1.5">
        <div class="grid flex-1 grid-cols-3 gap-1.5">
          <!-- Кнопка Чорно-білого режиму для малювання олівцем -->
          <button
            id="bwToggleBtn"
            type="button"
            class="flex items-center justify-center gap-1 whitespace-nowrap rounded-xl border border-white/15 bg-white/5 px-2 py-2 text-[11px] font-semibold text-zinc-200 transition active:scale-95"
          >
            <span class="h-3 w-3 shrink-0 rounded-full bg-gradient-to-r from-white to-zinc-800 border border-white/40"></span>
            <span>Ч/Б олівець</span>
          </button>

          <!-- Кнопка посилення контрасту / контурів -->
          <button
            id="contrastToggleBtn"
            type="button"
            class="flex items-center justify-center gap-1 whitespace-nowrap rounded-xl border border-white/15 bg-white/5 px-2 py-2 text-[11px] font-semibold text-zinc-200 transition active:scale-95"
          >
            <svg class="h-3.5 w-3.5 shrink-0 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <span>Контур</span>
          </button>

          <!-- Кнопка блокування переміщення -->
          <button
            id="lockPosBtn"
            type="button"
            class="flex items-center justify-center gap-1 whitespace-nowrap rounded-xl border border-white/15 bg-white/5 px-2 py-2 text-[11px] font-semibold text-zinc-200 transition active:scale-95"
          >
            <svg id="lockIcon" class="h-3.5 w-3.5 shrink-0 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
            </svg>
            <span id="lockLabel">Рухати</span>
          </button>
        </div>

        <!-- Кнопка згортання/розгортання нижньої панелі -->
        <button
          id="collapseControlsBtn"
          type="button"
          title="Згорнути/розгорнути налаштування"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl border border-white/15 bg-white/10 text-zinc-200 active:scale-95 transition"
        >
          <svg id="collapseChevron" class="h-4 w-4 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>

      <!-- Повзунки регулювання (згортаються при потребі) -->
      <div id="controlsBody" class="mt-2.5 space-y-2.5">
        <!-- 1. Прозорість накладання -->
        <div>
          <div class="mb-0.5 flex items-center justify-between text-[11px]">
            <span class="font-medium text-zinc-300">Прозорість накладання</span>
            <span id="opacityVal" class="font-semibold text-sky-400">55%</span>
          </div>
          <input id="opacitySlider" type="range" min="5" max="100" value="55" />
        </div>

        <!-- 2. Насиченість картинки -->
        <div>
          <div class="mb-0.5 flex items-center justify-between text-[11px]">
            <span class="font-medium text-zinc-300">Насиченість картинки</span>
            <span id="saturationVal" class="font-semibold text-sky-400">100%</span>
          </div>
          <input id="saturationSlider" type="range" min="0" max="200" value="100" />
        </div>

        <!-- 3. Розмір картинки -->
        <div>
          <div class="mb-0.5 flex items-center justify-between text-[11px]">
            <div class="flex items-center gap-2">
              <span class="font-medium text-zinc-300">Розмір картинки</span>
              <button
                id="resetTransformBtn"
                type="button"
                class="rounded-md bg-white/10 px-1.5 py-0.5 text-[10px] font-medium text-zinc-300 hover:bg-white/20 active:scale-95"
              >
                Скинути
              </button>
            </div>
            <span id="scaleVal" class="font-semibold text-sky-400">100%</span>
          </div>
          <input id="scaleSlider" type="range" min="20" max="300" value="100" />
        </div>

        <p class="pt-0.5 text-center text-[10px] leading-tight text-zinc-400">
          1 палець — рухати • 2 пальці — масштаб і поворот • Тап — фокус
        </p>
      </div>
    </div>
  </section>

</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const appContainer = document.getElementById('appContainer');
      let cameraFeed = document.getElementById('cameraFeed');
      const cameraStatusText = document.getElementById('cameraStatusText');
      const enableCameraBtn = document.getElementById('enableCameraBtn');
      const refreshCameraBtn = document.getElementById('refreshCameraBtn');
      const refreshCameraIcon = document.getElementById('refreshCameraIcon');

      const arStage = document.getElementById('arStage');
      const overlayImage = document.getElementById('overlayImage');
      const emptyStateHint = document.getElementById('emptyStateHint');
      const imageInput = document.getElementById('imageInput');

      const bottomControls = document.getElementById('bottomControls');
      const collapseControlsBtn = document.getElementById('collapseControlsBtn');
      const collapseChevron = document.getElementById('collapseChevron');

      const opacitySlider = document.getElementById('opacitySlider');
      const opacityVal = document.getElementById('opacityVal');
      const saturationSlider = document.getElementById('saturationSlider');
      const saturationVal = document.getElementById('saturationVal');
      const scaleSlider = document.getElementById('scaleSlider');
      const scaleVal = document.getElementById('scaleVal');

      const bwToggleBtn = document.getElementById('bwToggleBtn');
      const contrastToggleBtn = document.getElementById('contrastToggleBtn');
      const lockPosBtn = document.getElementById('lockPosBtn');
      const lockIcon = document.getElementById('lockIcon');
      const lockLabel = document.getElementById('lockLabel');
      const resetTransformBtn = document.getElementById('resetTransformBtn');

      const focusPaperBtn = document.getElementById('focusPaperBtn');
      const torchBtn = document.getElementById('torchBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
      const toastMessage = document.getElementById('toastMessage');

      const state = {
        stream: null,
        videoTrack: null,
        isStartingCamera: false,
        pickerWasOpened: false,
        torchOn: false,
        hasImage: false,
        isLocked: false,
        isBW: false,
        isHighContrast: false,
        isControlsCollapsed: false,
        opacity: 0.55,
        saturation: 100,
        x: 0,
        y: 0,
        scale: 1,
        rotation: 0
      };

      let toastTimer = null;

      function showToast(text) {
        if (!toastMessage) return;
        toastMessage.textContent = text;
        toastMessage.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastMessage.style.opacity = '0';
        }, 2200);
      }

      /**
       * Налаштування атрибутів та блокування системного плеєра iOS ("НАЖИВО" / повноекранне відео)
       */
      function configureVideoElement(videoEl) {
        if (!videoEl) return;
        videoEl.id = 'cameraFeed';
        videoEl.autoplay = true;
        videoEl.playsInline = true;
        videoEl.muted = true;
        videoEl.controls = false;
        videoEl.disablePictureInPicture = true;

        videoEl.setAttribute('autoplay', '');
        videoEl.setAttribute('playsinline', '');
        videoEl.setAttribute('webkit-playsinline', '');
        videoEl.setAttribute('muted', '');
        videoEl.setAttribute('disablepictureinpicture', '');
        videoEl.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
        videoEl.setAttribute('x-webkit-airplay', 'deny');

        videoEl.style.pointerEvents = 'none';
        videoEl.style.userSelect = 'none';
        videoEl.style.webkitUserSelect = 'none';

        // Миттєвий вихід, якщо iOS WebKit спробує розгорнути відео у системний плеєр
        videoEl.addEventListener('webkitbeginfullscreen', (e) => {
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
          if (typeof videoEl.webkitExitFullscreen === 'function') {
            try {
              videoEl.webkitExitFullscreen();
            } catch (_) {}
          }
        });
      }

      configureVideoElement(cameraFeed);

      /**
       * Запуск потоку задньої камери iPhone
       */
      async function startCamera(targetVideo = cameraFeed) {
        if (state.isStartingCamera) return;
        state.isStartingCamera = true;

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cameraStatusText.textContent =
              'Браузер не підтримує доступ до камери. Відкрийте сторінку в Safari через HTTPS.';
            return;
          }

          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              }
            });
          } catch (primaryErr) {
            // Запасний варіант, якщо камера не прийняла розширені обмеження
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: true
            });
          }

          state.stream = stream;
          targetVideo.srcObject = stream;
          await targetVideo.play();

          const tracks = stream.getVideoTracks();
          if (tracks.length > 0) {
            state.videoTrack = tracks[0];
            setupCameraCapabilities(state.videoTrack);
          }

          enableCameraBtn.classList.add('hidden');
          enableCameraBtn.classList.remove('flex');
        } catch (err) {
          console.error('Помилка камери:', err);
          enableCameraBtn.classList.remove('hidden');
          enableCameraBtn.classList.add('flex');
          cameraStatusText.textContent =
            'Натисніть «Увімкнути камеру» нижче або дозвольте доступ до камери в налаштуваннях Safari.';
        } finally {
          state.isStartingCamera = false;
        }
      }

      /**
       * Повний апаратний та DOM-перезапуск камери для усунення заморозки кадру в iOS WebView після галереї
       */
      async function hardRestartCamera(notify = false) {
        if (state.isStartingCamera) return;

        if (refreshCameraIcon) {
          refreshCameraIcon.style.transform = 'rotate(360deg)';
          setTimeout(() => {
            refreshCameraIcon.style.transform = 'rotate(0deg)';
          }, 350);
        }

        // 1. Зупиняємо всі поточні треки та очищаємо джерело старого відео
        if (state.stream) {
          try {
            state.stream.getTracks().forEach((t) => t.stop());
          } catch (_) {}
        }
        state.stream = null;
        state.videoTrack = null;
        state.torchOn = false;
        torchBtn.classList.remove('bg-amber-400', 'text-zinc-950');

        if (cameraFeed) {
          try {
            cameraFeed.pause();
            cameraFeed.srcObject = null;
          } catch (_) {}
        }

        // 2. Створюємо абсолютно новий елемент <video> та замінюємо старий у DOM
        const newVideo = document.createElement('video');
        configureVideoElement(newVideo);

        if (cameraFeed && cameraFeed.parentNode) {
          cameraFeed.parentNode.replaceChild(newVideo, cameraFeed);
        } else {
          appContainer.prepend(newVideo);
        }
        cameraFeed = newVideo;

        // 3. Заново отримуємо потік камери та запускаємо відтворення
        await startCamera(newVideo);

        if (notify) {
          showToast('Відеопотік камери оновлено');
        }
      }

      // Відстежуємо відкриття системного пікера фото та перезапускаємо камеру при поверненні фокусу
      imageInput.addEventListener('click', () => {
        state.pickerWasOpened = true;
      });

      window.addEventListener('focus', () => {
        if (state.pickerWasOpened) {
          state.pickerWasOpened = false;
          setTimeout(() => {
            hardRestartCamera(false);
          }, 350);
        } else if (cameraFeed && cameraFeed.paused && state.stream) {
          cameraFeed.play().catch(() => {});
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.pickerWasOpened) {
          state.pickerWasOpened = false;
          setTimeout(() => {
            hardRestartCamera(false);
          }, 350);
        }
      });

      /**
       * Налаштування автофокусу на аркуш та перевірка підтримки ліхтарика
       */
      async function setupCameraCapabilities(track) {
        if (!track || typeof track.getCapabilities !== 'function') return;
        try {
          const caps = track.getCapabilities();

          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            await track.applyConstraints({
              advanced: [{ focusMode: 'continuous' }]
            });
          }

          if (caps.torch) {
            torchBtn.classList.remove('hidden');
            torchBtn.classList.add('flex');
          } else {
            torchBtn.classList.add('hidden');
            torchBtn.classList.remove('flex');
          }
        } catch (_) {
          // Ігноруємо непідтримувані параметри на конкретній версії iOS
        }
      }

      /**
       * Примусове фокусування камери на аркуші + анімація прицілу
       */
      async function triggerFocusOnPaper(clientX, clientY) {
        const x = typeof clientX === 'number' ? clientX : window.innerWidth / 2;
        const y = typeof clientY === 'number' ? clientY : window.innerHeight / 2;

        const reticle = document.createElement('div');
        reticle.className = 'focus-reticle';
        reticle.style.left = `${x}px`;
        reticle.style.top = `${y}px`;
        document.body.appendChild(reticle);
        setTimeout(() => reticle.remove(), 1300);

        if (!state.videoTrack) return;

        try {
          const caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
          const advancedConstraints = [];

          if (caps.pointsOfInterest) {
            advancedConstraints.push({
              pointsOfInterest: [{
                x: Math.min(1, Math.max(0, x / window.innerWidth)),
                y: Math.min(1, Math.max(0, y / window.innerHeight))
              }]
            });
          }

          if (caps.focusMode) {
            if (caps.focusMode.includes('single-shot')) {
              advancedConstraints.push({ focusMode: 'single-shot' });
            } else if (caps.focusMode.includes('continuous')) {
              advancedConstraints.push({ focusMode: 'continuous' });
            }
          }

          if (advancedConstraints.length > 0) {
            await state.videoTrack.applyConstraints({ advanced: advancedConstraints });
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
              setTimeout(() => {
                if (state.videoTrack && state.videoTrack.readyState === 'live') {
                  state.videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                  }).catch(() => {});
                }
              }, 800);
            }
          }
        } catch (_) {}
      }

      /**
       * Перемикання ліхтарика iPhone для підсвічування аркуша
       */
      async function toggleTorch() {
        if (!state.videoTrack) return;
        try {
          state.torchOn = !state.torchOn;
          await state.videoTrack.applyConstraints({
            advanced: [{ torch: state.torchOn }]
          });
          torchBtn.classList.toggle('bg-amber-400', state.torchOn);
          torchBtn.classList.toggle('text-zinc-950', state.torchOn);
          showToast(state.torchOn ? 'Підсвітку увімкнено' : 'Підсвітку вимкнено');
        } catch (_) {
          state.torchOn = false;
          showToast('Ліхтарик недоступний у цьому режимі');
        }
      }

      /**
       * Оновлення візуальних стилів накладеної картинки
       */
      function renderImageState() {
        overlayImage.style.transform = `translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale}) rotate(${state.rotation}deg)`;
        overlayImage.style.opacity = state.opacity;

        const filters = [];
        if (state.isBW) {
          filters.push('grayscale(100%) contrast(115%)');
        } else {
          filters.push(`saturate(${state.saturation}%)`);
        }

        if (state.isHighContrast) {
          filters.push('contrast(155%) brightness(105%)');
        }

        overlayImage.style.filter = filters.join(' ');
      }

      /**
       * Завантаження зображення з галереї iPhone
       */
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];

        if (!file) {
          setTimeout(() => hardRestartCamera(false), 350);
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          overlayImage.onload = () => {
            // Перезапускаємо камеру через 350 мс після повного декодування фото, щоб iOS не заморожував кадр
            setTimeout(() => {
              hardRestartCamera(false);
            }, 350);
            overlayImage.onload = null;
          };

          overlayImage.src = event.target.result;
          overlayImage.classList.remove('hidden');
          emptyStateHint.classList.add('hidden');
          bottomControls.classList.remove('hidden');
          state.hasImage = true;
          state.pickerWasOpened = false;

          // Скидаємо позицію по центру при виборі нового фото
          state.x = 0;
          state.y = 0;
          state.scale = 1;
          state.rotation = 0;
          scaleSlider.value = 100;
          scaleVal.textContent = '100%';
          renderImageState();

          showToast('Фото завантажено! Підлаштуйте під аркуш');
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
      });

      // Згортання / розгортання нижньої панелі регулювань
      collapseControlsBtn.addEventListener('click', () => {
        state.isControlsCollapsed = !state.isControlsCollapsed;
        bottomControls.classList.toggle('collapsed', state.isControlsCollapsed);
        collapseChevron.style.transform = state.isControlsCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
      });

      // Повзунок прозорості накладання
      opacitySlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        state.opacity = val / 100;
        opacityVal.textContent = `${val}%`;
        renderImageState();
      });

      // Повзунок насиченості кольорів картинки
      saturationSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        state.saturation = val;
        saturationVal.textContent = `${val}%`;

        if (state.isBW && val > 0) {
          setBWMode(false);
        }
        renderImageState();
      });

      // Повзунок розміру (масштабу) картинки
      scaleSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        state.scale = val / 100;
        scaleVal.textContent = `${val}%`;
        renderImageState();
      });

      function setBWMode(enabled) {
        state.isBW = enabled;
        if (state.isBW) {
          bwToggleBtn.classList.add('bg-white', 'text-zinc-950', 'border-white');
          bwToggleBtn.classList.remove('bg-white/5', 'text-zinc-200', 'border-white/15');
          saturationVal.textContent = '0% (Ч/Б)';
        } else {
          bwToggleBtn.classList.remove('bg-white', 'text-zinc-950', 'border-white');
          bwToggleBtn.classList.add('bg-white/5', 'text-zinc-200', 'border-white/15');
          saturationVal.textContent = `${state.saturation}%`;
        }
        renderImageState();
      }

      bwToggleBtn.addEventListener('click', () => {
        setBWMode(!state.isBW);
        showToast(state.isBW ? 'Чорно-білий режим для олівця' : 'Кольоровий режим');
      });

      contrastToggleBtn.addEventListener('click', () => {
        state.isHighContrast = !state.isHighContrast;
        if (state.isHighContrast) {
          contrastToggleBtn.classList.add('bg-amber-400', 'text-zinc-950', 'border-amber-300');
          contrastToggleBtn.classList.remove('bg-white/5', 'text-zinc-200', 'border-white/15');
          showToast('Контури підсилено');
        } else {
          contrastToggleBtn.classList.remove('bg-amber-400', 'text-zinc-950', 'border-amber-300');
          contrastToggleBtn.classList.add('bg-white/5', 'text-zinc-200', 'border-white/15');
          showToast('Звичайний контраст');
        }
        renderImageState();
      });

      lockPosBtn.addEventListener('click', () => {
        state.isLocked = !state.isLocked;
        if (state.isLocked) {
          lockPosBtn.classList.add('bg-emerald-500', 'text-zinc-950', 'border-emerald-400');
          lockPosBtn.classList.remove('bg-white/5', 'text-zinc-200', 'border-white/15');
          lockLabel.textContent = 'Закріплено';
          lockIcon.classList.remove('text-emerald-400');
          lockIcon.classList.add('text-zinc-950');
          showToast('Позицію фото заблоковано');
        } else {
          lockPosBtn.classList.remove('bg-emerald-500', 'text-zinc-950', 'border-emerald-400');
          lockPosBtn.classList.add('bg-white/5', 'text-zinc-200', 'border-white/15');
          lockLabel.textContent = 'Рухати';
          lockIcon.classList.add('text-emerald-400');
          lockIcon.classList.remove('text-zinc-950');
          showToast('Можна рухати та масштабувати фото');
        }
      });

      resetTransformBtn.addEventListener('click', () => {
        state.x = 0;
        state.y = 0;
        state.scale = 1;
        state.rotation = 0;
        scaleSlider.value = 100;
        scaleVal.textContent = '100%';
        renderImageState();
        showToast('Розмір і положення скинуто');
      });

      // Кнопка «На весь екран» приховує лише HTML-панелі (.hud-hidden) без системного Fullscreen API
      function enterCleanFullscreen() {
        appContainer.classList.add('hud-hidden');
        showToast('Інтерфейс приховано. Натисніть «Меню», щоб повернути');
      }

      function exitCleanFullscreen() {
        appContainer.classList.remove('hud-hidden');
      }

      fullscreenBtn.addEventListener('click', enterCleanFullscreen);
      exitFullscreenBtn.addEventListener('click', exitCleanFullscreen);
      enableCameraBtn.addEventListener('click', () => startCamera(cameraFeed));
      refreshCameraBtn.addEventListener('click', () => hardRestartCamera(true));

      focusPaperBtn.addEventListener('click', () => {
        triggerFocusOnPaper(window.innerWidth / 2, window.innerHeight / 2);
        showToast('Фокусування на аркуші...');
      });
      torchBtn.addEventListener('click', toggleTorch);

      /**
       * Мультитач жести на сцені:
       * 1 палець — перетягування фото (або тап для фокусування камери на аркуші)
       * 2 пальці — щипок для масштабування і обертання
       */
      let gesture = {
        mode: 'none',
        startX: 0,
        startY: 0,
        initialX: 0,
        initialY: 0,
        initialDist: 0,
        initialScale: 1,
        initialAngle: 0,
        initialRotation: 0,
        moved: false
      };

      function getDistance(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      function getAngle(t1, t2) {
        return (Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180) / Math.PI;
      }

      arStage.addEventListener('touchstart', (e) => {
        if (!state.stream) {
          startCamera();
        }

        if (e.touches.length === 1) {
          gesture.mode = 'drag';
          gesture.moved = false;
          gesture.startX = e.touches[0].clientX;
          gesture.startY = e.touches[0].clientY;
          gesture.initialX = state.x;
          gesture.initialY = state.y;
        } else if (e.touches.length === 2 && state.hasImage && !state.isLocked) {
          gesture.mode = 'pinch';
          gesture.moved = true;
          gesture.initialDist = getDistance(e.touches[0], e.touches[1]);
          gesture.initialScale = state.scale;
          gesture.initialAngle = getAngle(e.touches[0], e.touches[1]);
          gesture.initialRotation = state.rotation;
        }
      }, { passive: false });

      arStage.addEventListener('touchmove', (e) => {
        e.preventDefault();

        if (gesture.mode === 'drag' && e.touches.length === 1) {
          const dx = e.touches[0].clientX - gesture.startX;
          const dy = e.touches[0].clientY - gesture.startY;
          if (Math.hypot(dx, dy) > 6) {
            gesture.moved = true;
          }

          if (state.hasImage && !state.isLocked && gesture.moved) {
            state.x = gesture.initialX + dx;
            state.y = gesture.initialY + dy;
            renderImageState();
          }
        } else if (gesture.mode === 'pinch' && e.touches.length === 2 && state.hasImage && !state.isLocked) {
          const currentDist = getDistance(e.touches[0], e.touches[1]);
          const currentAngle = getAngle(e.touches[0], e.touches[1]);

          if (gesture.initialDist > 0) {
            const rawScale = gesture.initialScale * (currentDist / gesture.initialDist);
            state.scale = Math.min(3.0, Math.max(0.2, rawScale));
            const pct = Math.round(state.scale * 100);
            scaleSlider.value = pct;
            scaleVal.textContent = `${pct}%`;
          }

          state.rotation = gesture.initialRotation + (currentAngle - gesture.initialAngle);
          renderImageState();
        }
      }, { passive: false });

      arStage.addEventListener('touchend', (e) => {
        if (gesture.mode === 'drag' && !gesture.moved && e.changedTouches.length > 0) {
          const touch = e.changedTouches[0];
          triggerFocusOnPaper(touch.clientX, touch.clientY);
        }
        if (e.touches.length === 0) {
          gesture.mode = 'none';
        }
      });

      arStage.addEventListener('click', (e) => {
        if (!state.stream) {
          startCamera(cameraFeed);
        }
        if (e.target === arStage) {
          triggerFocusOnPaper(e.clientX, e.clientY);
        }
      });

      // Початковий рендер і запуск камери
      renderImageState();
      startCamera(cameraFeed);
    });
  </script>
</body>
</html>
